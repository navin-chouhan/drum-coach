<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1194">
<title>Touch pads · iPad mockup</title>
<link rel="stylesheet" href="ipad.css">
<script src="mock.js"></script>
<style>
  /* No kit connected: the same lesson take, with a multi-touch kit drawn like the web app's kit and laid out as you'd
     sit at the MPS-150. */
  .barNow { font-size: 14px; font-weight: 800; color: #ccc; margin-left: 6px; }
  .barNow b { color: #fff; font: 900 22px var(--display); }
  .banner { position: absolute; left: 24px; right: 30px; top: 116px; height: 50px; background: var(--pop); border: 3px solid var(--line); box-shadow: 5px 5px 0 var(--line);
    display: flex; align-items: center; gap: 12px; padding: 0 8px 0 14px; }
  .banner .em { font-size: 22px; }
  .banner b { font: 900 17px var(--display); }
  .banner span.t { font-size: 14.5px; font-weight: 700; }
  .banner .btn { margin-left: auto; }
  .panel { position: absolute; left: 24px; right: 30px; top: 182px; height: 168px; background: var(--night); border: 3px solid var(--line); box-shadow: 6px 6px 0 var(--pop); overflow: hidden; }
  .panel svg { display: block; }
  .stage { position: absolute; left: 24px; right: 30px; top: 366px; height: 404px; border: 3px solid var(--line); box-shadow: 6px 6px 0 var(--pop); overflow: hidden; background: var(--night); }
  .stage svg { display: block; }
  .padsCap { position: absolute; left: 50%; transform: translateX(-50%); top: 376px; z-index: 2; font-size: 13.5px; font-weight: 800; background: var(--panel); border: 2px solid var(--line); border-radius: 999px; padding: 3px 12px; white-space: nowrap; }
</style>
</head>
<body>
<div class="ipad">
  <div class="status"><span>12:20</span><span class="date">Sat 31 Oct</span><span class="sp"></span><span class="ic i-wifi"></span><span>64%</span><span class="batt"><i style="width:62%"></i></span></div>

  <header class="top">
    <div class="title"><b>The money beat</b><span>Step 3 of 4 · + snare</span></div>
    <span class="barNow"><b>Bar 2</b> of 4</span>
    <span class="sp"></span>
    <span class="pill" style="border-color:#fff">👆 touch timing is scored a little looser</span>
    <div class="tempo"><div class="big num">70<small>BPM</small></div></div>
    <span class="btn red">■ Stop</span>
  </header>

  <div class="banner">
    <span class="em">🔌</span><b>No kit connected: touch pads are on.</b><span class="t">Plug the e-Drum into the USB-C port and the kit takes over.</span>
    <span class="btn sm">Kit help</span>
  </div>

  <section class="panel"><div id="hw"></div></section>

  <section class="stage"><div id="pads"></div></section>
  <div class="padsCap">Tap two pads at once for hi-hat + kick · nearer the centre = louder</div>
  <div class="home light"></div>
</div>
<script>
// A short highway: the same lanes, colours and count as the lesson screen.
document.getElementById('hw').innerHTML = highway({ W: 1134, H: 162, pos: 12, px: 52, nowX: 360, judged: { snare10: 'off' }, flash: ['hihat', 'kick'], size: 13, label: 16, top: 24, countH: 38, lateText: '' });

// The touch kit, in the web kit's drawing style. Pads in this lesson are bright; the rest still play.
const mine = ['hihat', 'snare', 'kick'];
const P = [
  { id: 'crash', x: 160, y: 96, r: 62 }, { id: 'hihat', x: 150, y: 254, r: 84 }, { id: 'tom1', x: 452, y: 98, r: 62 }, { id: 'tom2', x: 640, y: 98, r: 62 },
  { id: 'ride', x: 1000, y: 112, r: 82 }, { id: 'snare', x: 388, y: 274, r: 94 }, { id: 'floor', x: 862, y: 282, r: 90 }, { id: 'kick', x: 628, y: 300, w: 200, h: 112 },
];
const pads = P.map(p => [p, {
  dim: !mine.includes(p.id), labelSize: mine.includes(p.id) ? 22 : 17,
  hit: p.id === 'hihat' || p.id === 'kick' ? '#4BE08A' : null,
  word: p.id === 'hihat' ? 'TSS!' : p.id === 'kick' ? 'BOOM!' : null, wordSize: 30,
}]);
let svg = kit(1134, 398, pads, 't');
// the hi-hat pedal: hold it down for a closed hi-hat (the real pad sends open unless the pedal is down)
let extra = `<g filter="url(#tsh)"><rect x="46" y="346" width="210" height="44" rx="12" fill="#2F6FE4" stroke="${INK}" stroke-width="4"/></g>
  <text x="151" y="374" text-anchor="middle" font-family='${FONT}' font-weight="900" font-size="15" fill="#fff">HI-HAT PEDAL · hold</text>`;
// two fingers landing together, and the result sticker
for (const [cx, cy] of [[184, 214], [586, 282]]) extra += `<circle cx="${cx}" cy="${cy}" r="24" fill="#ffffffaa" stroke="${INK}" stroke-width="3"/>`;
extra += `<g transform="rotate(-6 300 190)"><rect x="252" y="160" width="104" height="38" fill="#4BE08A" stroke="${INK}" stroke-width="3"/><text x="304" y="186" text-anchor="middle" font-family='${FONT}' font-weight="900" font-size="18" fill="${INK}">ON IT!</text></g>`;
document.getElementById('pads').innerHTML = svg.replace('</svg>', extra + '</svg>');
</script>
</body>
</html>
