# Setup on a simulator (D10: one job, is everything working): the three status cards and the six rows are there, and
# each page and tool opens full screen and closes (Pads → note map and the MIDI input picker, Kit test, latency, While
# you play, Coach connection). testIDs: src/features/setup/SetupScreen.tsx (ToolFrame: `setup-tool-<page or tool>` and
# `setup-tool-<page or tool>-close`; a tool opened from a page closes back to it), src/features/pads/NoteMapPanel.tsx,
# src/features/latency/LatencyPanel.tsx.
appId: com.drumcoach.app
name: Setup status, pages and tools
tags:
  - smoke
  - v1
---
- runFlow: subflows/open-app.yaml
- tapOn:
    id: nav-setup
- extendedWaitUntil:
    visible:
      id: screen-setup
    timeout: 10000
- assertVisible:
    id: setup-kit
- assertVisible:
    id: setup-kit-name
- assertVisible:
    id: setup-latency-measure
- assertVisible:
    id: setup-coach
- assertVisible:
    id: setup-row-kitpads
- assertVisible:
    id: setup-row-connection
- takeScreenshot: setup

# Pads → Note map: the in-app remap (CLAUDE.md: always let the user remap notes); Close goes back to Pads
- tapOn:
    id: setup-row-kitpads
- extendedWaitUntil:
    visible:
      id: setup-tool-kitpads
    timeout: 5000
- assertVisible:
    id: setup-pads
- tapOn:
    id: setup-notemap
- extendedWaitUntil:
    visible:
      id: setup-tool-notemap
    timeout: 5000
- assertVisible:
    id: notemap-snare
- tapOn:
    id: setup-tool-notemap-close
# MIDI input picker, from the same page
- extendedWaitUntil:
    visible:
      id: setup-midi-input-row
    timeout: 5000
- tapOn:
    id: setup-midi-input-row
- extendedWaitUntil:
    visible:
      id: setup-tool-input
    timeout: 5000
- tapOn:
    id: setup-tool-input-close
- tapOn:
    id: setup-tool-kitpads-close

# Kit test
- tapOn:
    id: setup-kit-test
- extendedWaitUntil:
    visible:
      id: setup-tool-kittest
    timeout: 5000
- tapOn:
    id: setup-tool-kittest-close

# Latency: the tap test panel (no kit: nothing to measure; just open and close)
- tapOn:
    id: setup-latency-measure
- extendedWaitUntil:
    visible:
      id: latency-start
    timeout: 5000
- tapOn:
    id: setup-tool-latency-close

# While you play: kit gestures
- tapOn:
    id: setup-row-play
- extendedWaitUntil:
    visible:
      id: setup-gestures
    timeout: 5000
- tapOn:
    id: setup-tool-play-close

# Coach connection: Test connection with nothing configured stays disabled; Save and test with a bad URL says why
- tapOn:
    id: setup-row-connection
- extendedWaitUntil:
    visible:
      id: setup-server
    timeout: 5000
- assertVisible:
    id: setup-api-key
- tapOn:
    id: setup-server-url
- inputText: "not a url"
- hideKeyboard
- tapOn:
    id: setup-server-test
- extendedWaitUntil:
    visible:
      id: setup-server-result
    timeout: 10000
- takeScreenshot: setup-server-bad-url
