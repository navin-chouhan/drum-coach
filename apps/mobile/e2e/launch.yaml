# T3 smoke: the app launches (finishing the first run on a fresh install) and Journey shows beside the sidebar.
# testIDs: home-title (src/ui/Sidebar.tsx brand, set in app/(main)/_layout.tsx), screen-journey, journey-next,
# journey-set (src/features/journey/JourneyScreen.tsx), nav-* (src/ui/nav.ts).
appId: com.drumcoach.app
name: Launch shows Journey
tags:
  - smoke
---
- runFlow: subflows/open-app.yaml
- assertVisible:
