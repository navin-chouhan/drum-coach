# T3 smoke: the app launches (finishing the first run on a fresh install) and Journey shows beside the sidebar.
# testIDs: home-title (src/ui/Sidebar.tsx brand, set in app/(main)/_layout.tsx), screen-journey, journey-next,
# journey-set (src/features/journey/JourneyScreen.tsx), nav-* (src/ui/nav.ts).
appId: com.drumcoach.app
name: Launch shows Journey
tags:
  - smoke
---
- runFlow: subflows/open-app.yaml
- assertVisible:
    id: home-title
    text: Drum Coach
- assertVisible:
    id: journey-next
- assertVisible:
    id: journey-set
# D10: four sections (Songs is in Practice, Progress is You, the coach chat opens from its bubble)
- assertVisible:
    id: nav-journey
- assertVisible:
    id: nav-practice
- assertVisible:
    id: nav-you
- assertVisible:
    id: nav-setup
- assertNotVisible:
    id: nav-songs
- assertVisible:
    id: sidebar-expanded # Journey opens with the sidebar expanded
- assertVisible:
    id: sidebar-kit # the one kit dot
- takeScreenshot: launch-journey
# Other sections fold it to the icon rail; « / » flips it and the choice sticks
- tapOn:
    id: nav-practice
- assertVisible:
    id: sidebar-rail
- tapOn:
    id: sidebar-toggle
- assertVisible:
    id: sidebar-expanded
- tapOn:
    id: nav-journey
- assertVisible:
    id: sidebar-expanded
- tapOn:
    id: sidebar-toggle
- assertVisible:
    id: sidebar-rail
# The coach chat: a tap on the coach's bubble opens it as a sheet; ✕ closes it
- tapOn:
    id: title-coach
- extendedWaitUntil:
    visible:
      id: coach-chat
    timeout: 5000
- tapOn:
    id: coach-close
- assertNotVisible:
    id: coach-chat
