    text: Drum Coach
- assertVisible:
    id: journey-next
- assertVisible:
    id: journey-set
- assertVisible:
    id: nav-songs
- assertVisible:
    id: nav-practice
- assertVisible:
    id: nav-progress
- assertVisible:
    id: nav-coach
- assertVisible:
    id: nav-setup
- takeScreenshot: launch-journey
