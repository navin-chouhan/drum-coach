# You → Show-off & fills: the show-off set (web ProgressView): on a fresh install it says how a song lands there; with ready songs it
# lists them with ▶ Play it and a concert of the whole set (needs a passed stage and its song: checked by the owner,
# FINAL-CHECKLIST). testIDs: src/features/progress/ProgressScreen.tsx.
appId: com.drumcoach.app
name: Progress show-off set
tags:
  - v1
---
- runFlow: subflows/open-app.yaml
- tapOn:
    id: nav-you # D10: Progress is You
- extendedWaitUntil:
    visible:
      id: screen-progress
    timeout: 10000
- tapOn:
    id: progress-back # if You opened on the path view
    optional: true
- tapOn:
    id: you-door-showoff # D10: Show-off & fills is a door on You
- extendedWaitUntil:
    visible:
      id: progress-showoff
    timeout: 10000
- assertVisible:
    id: "progress-showoff-empty|progress-showoff-0"
- assertVisible:
    text: "Show-off set"
- takeScreenshot: progress-showoff
