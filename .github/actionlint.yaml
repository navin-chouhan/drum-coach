# actionlint's built-in runner list predates GitHub's `xcode-27` macOS image (GA 2026-10-15), so it reports the label
# as unknown. It's a GitHub-hosted image (see actions/runner-images: images/macos/xcode-27-arm64-Readme.md), used by
# .github/workflows/ios.yml. Remove this once actionlint knows the label.
self-hosted-runner:
  labels:
    - xcode-27
