# Supply chain, secrets and the workflows themselves. Tools are pinned: actions by commit, binaries by checksum.
name: Security

on:
  push:
    branches-ignore: ['dependabot/**'] # Dependabot's branches are checked by their pull request
  pull_request:
  schedule:
    - cron: '29 4 * * 1' # Mondays: new advisories and leaked-key rules arrive without a push
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: npm audit and signatures
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - name: Known vulnerabilities (any severity, dev tools included)
        run: npm audit --audit-level=low
      - name: Registry signatures and provenance of every installed package
        run: npm audit signatures

  secrets:
    name: Secret scan (whole history)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar xzf gitleaks.tar.gz gitleaks
      - name: Scan every commit
        run: '"$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .'

  workflows:
    name: Workflow lint (actionlint, zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.31.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (checksum-verified)
        run: |
          cd "$RUNNER_TEMP"
          curl -sSfL -o actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
      - name: actionlint (syntax, expressions, shellcheck)
        run: '"$RUNNER_TEMP/actionlint" -color'
      - name: zizmor (injection, permissions, pinning, credentials)
        env:
          GH_TOKEN: ${{ github.token }} # read-only: lets zizmor check that pinned commits really belong to each action
        run: pipx run --spec "zizmor==${ZIZMOR_VERSION}" zizmor --format=github .github

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: low
          # Exceptions, each one approved by the owner (2026-10-30, docs/mobile/BOARD.md B26). Both are in Expo's
          # command-line tooling in apps/mobile and spikes/midi-probe (runs on the dev machine at build time, never
          # ships in the iPad app), and neither has a fixed release yet. Remove each one when Expo ships a fix.
          # - GHSA-mrhx-c7xc-m3w5 (zod < 4.6.6, high): @expo/cli pins zod 3.25.76; no 3.x fix exists.
          # - GHSA-gcqx-w48m-w2h4 (deepmerge <= 4.3.1, low): @expo/config; 4.3.1 is deepmerge's latest release.
          allow-ghsas: GHSA-mrhx-c7xc-m3w5, GHSA-gcqx-w48m-w2h4
