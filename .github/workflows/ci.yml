# Quality gate: the same checks as `npm run check`, on the oldest Node we support and the one we develop on.
name: CI

on:
  push:
    branches-ignore: ['dependabot/**'] # Dependabot's branches are checked by their pull request
  pull_request:
  schedule:
    - cron: '17 4 * * 1' # Mondays: dependency age, deprecations and audits change without a push
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node: ['22.18', '24'] # package.json "engines" floor, and .nvmrc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install (lockfile only, no install scripts)
        run: npm ci
      - name: Dependencies are stable, aged and from the registry (web root; the mobile job checks the sub-projects)
        run: node scripts/check-deps.mjs
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests with coverage thresholds
        run: npm run test:coverage
      - name: Build
        run: npm run build

  # The iPad app (apps/mobile, its own npm project) and every other sub-project with its own lockfile
  # (spikes/midi-probe, scripts/mobile-playtest, ...): the same dependency gate, with each one's deps-allow.json.
  mobile:
    name: Mobile (apps/mobile and sub-project dependencies)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm # npm's tarball cache only; npm ci still checks every tarball against the lockfile's sha512
          cache-dependency-path: |
            package-lock.json
            apps/mobile/package-lock.json
      - name: Dependencies of every sub-project are stable, aged and from the registry
        working-directory: .
        run: node scripts/check-deps.mjs --projects
      - name: Install the root too (parity tests import the web and server schemas, which need the root's zod; lint uses the root's ESLint)
        working-directory: .
        run: npm ci
      - name: Install (lockfile only, no install scripts)
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (the root's rules, eslint.rules.js)
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Native modules match the Expo SDK patch
        run: npm run check:versions
